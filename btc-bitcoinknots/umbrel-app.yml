manifestVersion: 1.1
id: btc-bitcoinknots
category: bitcoin
name: Bitcoin Knots
implements:
  - bitcoin
version: "1.2.20-knotsdev.rc5"
tagline: Bitcoin Knots with the 29.4.3rc5 community test build
icon: https://raw.githubusercontent.com/getumbrel/umbrel-apps-gallery/refs/heads/master/bitcoin-knots/icon.svg
description: >-
  This is the knots-dev copy of Leo Haf's Bitcoin Knots app. It adds Bitcoin Knots 29.4.3rc5, a community test build that is not an official Bitcoin Knots release, and runs it by default. Run it on test nodes only. Release, signatures and Guix attestations: https://github.com/knots-dev/bitcoin/releases/tag/v29.4.3.knots20260508rc5


  Your chain data and settings stay as they are. Every Knots version from Leo Haf's app is still on the Version tab. To go back, leave the version on "Always use the latest version", remove this store, add https://github.com/Horizon-btc/Bitcoin-store again and update the app.


  Take control of your digital sovereignty by choosing Bitcoin Knots to run your node! By using Knots, you’re supporting a version of Bitcoin that prioritizes efficiency, security, and flexibility. With Bitcoin Knots’ enhanced configuration options, you can fine-tune your node to help keep the network clean and resilient, actively reducing unnecessary load from spam or parasitic transactions.


  Every node strengthens the Bitcoin network, and your decision to use Bitcoin Knots contributes directly to a more decentralized and spam-resistant ecosystem. Your node not only validates and secures transactions but also sets an example for a more sustainable, user-focused Bitcoin network.


  Welcome to the community of Bitcoin Knots users, and thank you for helping Bitcoin grow stronger!


  Here's a guide on how to move the blockchain from bitcoin core to knots: https://docs.mempool.guide/page/migrationumbrel.html


  To forward incoming peer traffic to your device, set up the following configuration: (router) 9333 -> (device) 9333


  Powered by Bitcoin Knots: https://bitcoinknots.org/
developer: Horizon BTC
website: https://bitcoinknots.org
dependencies: []
repo: https://github.com/knots-dev/umbrel-bitcoin
support: https://github.com/knots-dev/umbrel-bitcoin/issues
port: 2113
gallery:
  - https://raw.githubusercontent.com/getumbrel/umbrel-apps-gallery/refs/heads/master/bitcoin-knots/1.jpg
  - https://raw.githubusercontent.com/getumbrel/umbrel-apps-gallery/refs/heads/master/bitcoin-knots/2.jpg
  - https://raw.githubusercontent.com/getumbrel/umbrel-apps-gallery/refs/heads/master/bitcoin-knots/3.jpg
path: ""
defaultPassword: ""
releaseNotes: >-
  Adds Bitcoin Knots 29.4.3rc5, the community test build from knots-dev, and makes it the default. The image ships the Guix-built binary from the knots-dev release, checked at build time against SHA256SUMS signed by A47D 99B6 DB0D 715D 40C5 9A20 23AE 8A8E A7E2 4E38.
widgets:
  - id: "stats"
    type: "four-stats"
    refresh: "5s"
    endpoint: "app:3000/api/widget/stats"
    link: ""
    example:
      type: "four-stats"
      link: ""
      items:
        - title: "Connections"
          text: "11"
          subtext: "peers"
        - title: "Mempool"
          text: "257"
          subtext: "MB"
        - title: "Hashrate"
          text: "590"
          subtext: "EH/s"
        - title: "Blockchain size"
          text: "600"
          subtext: "GB"
  - id: "sync"
    type: "text-with-progress"
    refresh: "2s"
    endpoint: "app:3000/api/widget/sync"
    link: ""
    example:
      type: "text-with-progress"
      link: ""
      title: "Blockchain sync"
      text: "83%"
      progressLabel: "In progress"
      progress: 0.83
backupIgnore:
  - data/bitcoin/blocks
  - data/bitcoin/chainstate
  - data/bitcoin/indexes
  - data/bitcoin/testnet3/blocks
  - data/bitcoin/testnet3/chainstate
  - data/bitcoin/testnet3/indexes
  - data/bitcoin/testnet4/blocks
  - data/bitcoin/testnet4/chainstate
  - data/bitcoin/testnet4/indexes
  - data/bitcoin/signet/blocks
  - data/bitcoin/signet/chainstate
  - data/bitcoin/signet/indexes
  - data/bitcoin/regtest/blocks
  - data/bitcoin/regtest/chainstate
  - data/bitcoin/regtest/indexes
submitter: Léo Haf
submission: https://github.com/getumbrel/umbrel-apps/pull/953
